      "<div class='noprint' style='margin-top:22px'><b>"+esc(t("inviteT"))+"</b><p class='sub' style='margin:4px 0 8px'>"+esc(t("inviteX"))+"</p><input type='text' readonly value='"+esc(link)+"' id='kl' style='width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)'><div class='row'><button class='btn red' id='kc'>"+esc(t("copy"))+"</button><a class='btn ghost' target='_blank' rel='noopener' href='https://wa.me/?text="+encodeURIComponent(t("waText")+" "+link)+"'>"+esc(t("wa"))+"</a></div><div class='okmsg' id='kmsg' role='status'></div>"+
      "<div class='row'><button class='lnk' id='ko'>"+esc(t("out"))+"</button><button class='lnk' id='kd' style='color:var(--red)'>"+esc(t("leave"))+"</button></div></div>";
    $("#kp").onclick=function(){window.print()};
    $("#kc").onclick=function(){var i=$("#kl");i.select();try{navigator.clipboard.writeText(i.value).then(function(){$("#kmsg").textContent=t("copied")},function(){document.execCommand("copy");$("#kmsg").textContent=t("copied")})}catch(e){document.execCommand("copy");$("#kmsg").textContent=t("copied")}};
    if($("#kv"))$("#kv").onclick=function(){fb().then(function(x){return x.F.updateDoc(x.F.doc(x.db,"members",USER.uid),{voter:"yes"})}).then(function(){MEMBER.voter="yes";jrender();$("#kmsg").textContent=t("voterOk")}).catch(function(){$("#kmsg").textContent=t("eNet")})};
    $("#ko").onclick=signOut;
    $("#kd").onclick=function(){$("#kmsg").innerHTML=esc(t("leaveQ"))+" <button class='lnk' id='ky'>"+esc(t("leaveYes"))+"</button> · <button class='lnk' id='kn'>"+esc(t("leaveNo"))+"</button>";
      $("#kn").onclick=function(){$("#kmsg").textContent=""};
      $("#ky").onclick=function(){fb().then(function(x){var mref=x.F.doc(x.db,"members",USER.uid),tref=x.F.doc(x.db,"tally",MEMBER.place);
        return x.F.runTransaction(x.db,function(tx){return tx.get(tref).then(function(s){var n=s.exists()?(s.data().n||0):0;tx.delete(mref);tx.set(tref,{n:Math.max(0,n-1)})})}).then(function(){MEMBER=null;STATE="account";MSG=t("left");return x.A.signOut(x.auth)})}).catch(function(){$("#kmsg").textContent=t("eNet")})};
    };
  }
}
function signOut(){fb().then(function(x){return x.A.signOut(x.auth)})}
render();loadTally();boot();
})();
</script>
