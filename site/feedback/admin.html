<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Public Voice · Review team</title>
<style>
:root{--bg:#fff;--surface:#f5f6f8;--ink:#12151c;--muted:#555c6b;--line:#d7dbe3;--accent:#00209F;--red:#C8102E}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--surface:#1a1f2a;--ink:#eef0f5;--muted:#a3abbb;--line:#30384a;--accent:#7f9cff;--red:#ff6b81}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:14px}h1{font-size:1.25rem}[hidden]{display:none!important}
input,select,textarea,button{font:inherit;color:inherit;padding:8px;border:1px solid var(--line);background:var(--bg)}
button{cursor:pointer;background:var(--accent);color:#fff;border:0;padding:8px 14px}button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button.on{outline:2px solid var(--ink)}
table{border-collapse:collapse;width:100%;font-size:.85rem}td,th{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.card{background:var(--surface);border:1px solid var(--line);padding:12px;margin:10px 0}.err{color:var(--red)}
.filters{display:flex;gap:8px;flex-wrap:wrap}.muted{color:var(--muted)}pre{white-space:pre-wrap;margin:4px 0}
</style></head><body><div class="wrap">
<h1>Public Voice · Review team</h1>
<div id="login" class="card">
  <p>Sign in with the review-team account. Every access is logged.</p>
  <p><input id="em" type="email" placeholder="email" autocomplete="username"> <input id="pw" type="password" placeholder="password" autocomplete="current-password"> <button id="go">Sign in</button></p>
  <p class="err" id="lerr"></p>
</div>
<div id="app" hidden>
  <div class="tabs" id="tabs"></div>
  <div id="main"></div>
</div>
</div>
<script src="config.js"></script>
<script src="parts.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, getDocs, addDoc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
var C=window.VOICE_CONFIG,$=function(s){return document.querySelector(s)};
var app=initializeApp(C.firebase),auth=getAuth(app),DB=getFirestore(app),UID="";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function title(n){return n===0?"General":n+". "+window.PARTS_EN[n-1]}
function log(action){return addDoc(collection(DB,"accessLog"),{uid:UID,action:action,at:serverTimestamp()})}
function ts(x){return x&&x.toDate?x.toDate():new Date(0)}
var CACHE=null;
function loadAll(){
  return Promise.all([getDocs(collection(DB,"submissions")),getDocs(collection(DB,"people"))]).then(function(r){
    var people={};r[1].forEach(function(d){people[d.id]=d.data()});
    var subs=[];r[0].forEach(function(d){var x=d.data();x.id=d.id;x.p=people[x.pid]||{};x.date=ts(x.at);subs.push(x)});
    subs.sort(function(a,b){return b.date-a.date});CACHE={subs:subs,people:people};return CACHE});
}
$("#go").onclick=function(){
  $("#lerr").textContent="";
  signInWithEmailAndPassword(auth,$("#em").value,$("#pw").value).then(function(c){UID=c.user.uid;return getDoc(doc(DB,"admins",UID))})
  .then(function(s){if(!s.exists())throw new Error("This account is not on the review team.");return log("login")})
  .then(function(){$("#login").hidden=true;$("#app").hidden=false;tabs();show("overview")})
  .catch(function(e){$("#lerr").textContent=String(e.message||e)});
};
var T=[["overview","Overview"],["subs","Submissions"],["flags","Campaigns"],["pub","Publish results"],["rev","Revision log"],["exp","Export"],["data","Retention"]];
function tabs(){$("#tabs").innerHTML="";T.forEach(function(t){var b=document.createElement("button");b.textContent=t[1];b.className="alt";b.onclick=function(){show(t[0])};b.dataset.t=t[0];$("#tabs").appendChild(b)})}
function show(id){Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){b.className=b.dataset.t===id?"on":"alt"});$("#main").innerHTML="<p class='muted'>Loading…</p>";VIEWS[id]().catch(function(e){$("#main").innerHTML="<p class='err'>"+esc(e.message)+"</p>"})}
function norm(t){return String(t||"").toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"")}
function hash(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0}return h}
function aggregate(subs,k){
  var out={},by={};
  subs.forEach(function(s){(by[s.part]=by[s.part]||[]).push(s)});
  Object.keys(by).forEach(function(part){
    var rows=by[part];
    function tally(list){var o={n:list.length,approve:0,changes:0,disapprove:0};list.forEach(function(s){o[s.vote]++});return o}
    function groups(key){var g={};rows.forEach(function(s){var v=key(s);if(v)(g[v]=g[v]||[]).push(s)});return Object.keys(g).filter(function(x){return g[x].length>=k}).map(function(x){var o=tally(g[x]);o.group=x;return o})}
    var t=tally(rows);
    out[part]={total:t.n,approve:t.approve,changes:t.changes,disapprove:t.disapprove,byLives:groups(function(s){return s.p.lives}),byOccupation:groups(function(s){return s.p.occupation})};
  });
  return out;
}
function settings(){return getDoc(doc(DB,"settings","main")).then(function(s){return Object.assign({minGroup:20,retentionMonths:12,reviewClosedAt:""},s.exists()?s.data():{})})}
var VIEWS={
overview:function(){return loadAll().then(function(c){
  var by={};c.subs.forEach(function(r){var o=by[r.part]||(by[r.part]={n:0,a:0,c:0,d:0,nw:0,ab:0});o.n++;o[r.vote==="approve"?"a":r.vote==="changes"?"c":"d"]++;if(r.status==="new")o.nw++;if(r.p.lives==="abroad")o.ab++});
  var h="<p>"+c.subs.length+" submissions from "+Object.keys(c.people).length+" people.</p><table><tr><th>Section</th><th>All</th><th>Approve</th><th>With changes</th><th>Disapprove</th><th>Abroad</th><th>New</th></tr>";
  for(var n=0;n<=47;n++){var o=by[n]||{n:0,a:0,c:0,d:0,nw:0,ab:0};h+="<tr><td>"+esc(title(n))+"</td><td>"+o.n+"</td><td>"+o.a+"</td><td>"+o.c+"</td><td>"+o.d+"</td><td>"+o.ab+"</td><td>"+o.nw+"</td></tr>"}
  $("#main").innerHTML=h+"</table>"})},
subs:function(){return loadAll().then(function(c){
  $("#main").innerHTML="<div class='filters'><select id='fp'><option value=''>All sections</option>"+Array.from({length:48},function(_,n){return "<option value='"+n+"'>"+esc(title(n))+"</option>"}).join("")+"</select><select id='fv'><option value=''>All votes</option><option>approve</option><option>changes</option><option>disapprove</option></select><select id='fs'><option value=''>All statuses</option><option>new</option><option>reviewed</option><option>accepted</option><option>declined</option><option>translate</option></select><select id='fl'><option value=''>All languages</option><option>en</option><option>ht</option><option>fr</option><option>es</option><option>pt</option><option>other</option></select><input id='fc' placeholder='country code'><input id='fo' placeholder='occupation'><button id='fgo'>Filter</button></div><div id='lst'></div>";
  function draw(){
    var rows=c.subs.filter(function(r){return(!$("#fp").value||String(r.part)===$("#fp").value)&&(!$("#fv").value||r.vote===$("#fv").value)&&(!$("#fs").value||r.status===$("#fs").value)&&(!$("#fl").value||r.commentLang===$("#fl").value)&&(!$("#fc").value||r.p.country===$("#fc").value.toUpperCase())&&(!$("#fo").value||String(r.p.occupation||"").toLowerCase().indexOf($("#fo").value.toLowerCase())>-1)}).slice(0,300);
    $("#lst").innerHTML=rows.map(function(r){var p=r.p;return "<div class='card'><b>"+esc(title(r.part))+"</b> · "+esc(r.vote)+" · <span class='muted'>"+esc(r.commentLang||"")+" · "+esc(r.status)+" · "+esc(r.date.toISOString().slice(0,16))+"</span><div class='muted'>"+esc(p.name)+" · "+esc(p.commune)+(p.departement?" ("+esc(p.departement)+")":"")+", "+esc(p.country)+" · "+esc(p.occupationOther||p.occupation)+" · "+esc(p.yearsThere==null?"?":p.yearsThere)+" y there"+(p.yearsSinceLeft!=null?" · left "+p.yearsSinceLeft+" y ago":"")+(p.ageRange?" · "+esc(p.ageRange):"")+"</div><pre>"+esc(r.comment)+"</pre>"+(r.wording?"<div><b>Proposed wording</b><pre>"+esc(r.wording)+"</pre></div>":"")+"<div class='filters'><select data-id='"+r.id+"' data-f='status'>"+["new","reviewed","accepted","declined","translate"].map(function(s){return "<option"+(s===r.status?" selected":"")+">"+s+"</option>"}).join("")+"</select><input data-id='"+r.id+"' data-f='publicReason' placeholder='public reason (if declined)' value='"+esc(r.publicReason||"")+"'><input data-id='"+r.id+"' data-f='adminNote' placeholder='private note / translation' value='"+esc(r.adminNote||"")+"'></div></div>"}).join("")||"<p>No results.</p>";
    Array.prototype.forEach.call(document.querySelectorAll("#lst [data-f]"),function(e){e.onchange=function(){var b={};b[e.dataset.f]=e.value;updateDoc(doc(DB,"submissions",e.dataset.id),b).catch(function(x){alert(x.message)})}});
  }
  $("#fgo").onclick=draw;draw()})},
flags:function(){return loadAll().then(function(c){
  var g={};c.subs.forEach(function(s){var n=norm(s.comment);if(n.length<20)return;(g[n]=g[n]||[]).push(s)});
  var rows=Object.keys(g).map(function(k){return g[k]}).filter(function(l){if(l.length<5)return false;var ds=l.map(function(s){return s.date.getTime()}).sort();for(var i=0;i+4<ds.length;i++)if(ds[i+4]-ds[i]<3600000)return true;return false});
  $("#main").innerHTML="<p>Five or more near-identical comments inside one hour are grouped as one organised position.</p>"+(rows.length?"<table><tr><th>Group</th><th>Comments</th><th>First</th><th>Last</th><th>Sections</th></tr>"+rows.map(function(l){var ds=l.map(function(s){return s.date}).sort(function(a,b){return a-b});return "<tr><td>"+esc(String(hash(norm(l[0].comment))))+"</td><td>"+l.length+"</td><td>"+esc(ds[0].toISOString().slice(0,16))+"</td><td>"+esc(ds[ds.length-1].toISOString().slice(0,16))+"</td><td>"+esc(Array.from(new Set(l.map(function(s){return s.part}))).join(", "))+"</td></tr>"}).join("")+"</table>":"<p>None flagged.</p>")})},
pub:function(){return Promise.all([loadAll(),settings(),getDoc(doc(DB,"public","results"))]).then(function(r){
  var c=r[0],st=r[1],cur=r[2].exists()?r[2].data():null;
  $("#main").innerHTML="<p>Public results are a snapshot that you publish. Breakdown groups of fewer than <b>"+st.minGroup+"</b> people are removed before publishing, so small groups are never visible. Comments are never published.</p><p>Last published: "+esc(cur&&cur.updated||"never")+"</p><p><label><input type='checkbox' id='fold'> Group near-identical campaign comments as one voice (counts each group once)</label></p><p><button id='pb'>Publish results now</button> <span id='pm'></span></p>";
  $("#pb").onclick=function(){
    var subs=c.subs;
    if($("#fold").checked){var seen={};subs=subs.filter(function(s){var n=norm(s.comment);if(n.length<20)return true;var k=s.part+":"+n;var cnt=c.subs.filter(function(x){return x.part===s.part&&norm(x.comment)===n}).length;if(cnt<5)return true;if(seen[k])return false;seen[k]=1;return true})}
    var data={updated:new Date().toISOString(),minGroup:st.minGroup,parts:aggregate(subs,st.minGroup)};
    setDoc(doc(DB,"public","results"),data).then(function(){return log("publish_results")}).then(function(){$("#pm").textContent="Published."}).catch(function(e){$("#pm").textContent=e.message})}})},
rev:function(){$("#main").innerHTML="<p>Write what was proposed (summarised, quotes anonymised) and what changed or not and why. It is shown publicly on the section page.</p><select id='rp'>"+Array.from({length:48},function(_,n){return "<option value='"+n+"'>"+esc(title(n))+"</option>"}).join("")+"</select><br><textarea id='rb' rows='12' style='width:100%;margin-top:8px'></textarea><p><button id='rs'>Save</button> <span id='rm'></span></p>";
  function l(){return getDoc(doc(DB,"revisions",$("#rp").value)).then(function(s){$("#rb").value=s.exists()?s.data().body:""})}
  $("#rp").onchange=l;$("#rs").onclick=function(){setDoc(doc(DB,"revisions",$("#rp").value),{body:$("#rb").value,updated:new Date().toISOString()}).then(function(){$("#rm").textContent="Saved."}).catch(function(e){$("#rm").textContent=e.message})};return l()},
exp:function(){$("#main").innerHTML="<p><button id='e1'>Download submissions (CSV, no emails)</button></p><p><button class='alt' id='e2'>Download emails (CSV)</button> <span class='muted'>Needs a second confirmation. The access is logged.</span></p>";
  function csv(rows){if(!rows.length)return "";var k=Object.keys(rows[0]);return k.join(",")+"\n"+rows.map(function(r){return k.map(function(c){var v=r[c];if(v&&typeof v==="object")v=JSON.stringify(v);return "\""+String(v==null?"":v).replace(/"/g,"\"\"")+"\""}).join(",")}).join("\n")}
  function dl(n,t){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download=n;a.click()}
  $("#e1").onclick=function(){log("export_submissions").then(loadAll).then(function(c){dl("submissions.csv",csv(c.subs.map(function(s){var p=s.p;return {part:s.part,vote:s.vote,status:s.status,commentLang:s.commentLang,comment:s.comment,wording:s.wording,date:s.date.toISOString(),name:p.name,country:p.country,lives:p.lives,departement:p.departement,commune:p.commune,occupation:p.occupationOther||p.occupation,yearsThere:p.yearsThere,yearsSinceLeft:p.yearsSinceLeft,ageRange:p.ageRange}})))})};
  $("#e2").onclick=function(){if(!confirm("Export email addresses? This is logged."))return;if(prompt("Type EMAILS to confirm")!=="EMAILS")return;log("export_emails").then(function(){return getDocs(collection(DB,"emails"))}).then(function(s){var r=[];s.forEach(function(d){var x=d.data();r.push({id:d.id,email:x.email,mayContact:x.mayContact})});dl("emails.csv",csv(r))})};
  return Promise.resolve()},
data:function(){return settings().then(function(st){$("#main").innerHTML="<p>Data are deleted once the review is closed and the retention period has passed. Set <b>reviewClosedAt</b> (a date such as 2027-06-30) when the review closes.</p><p><label>minGroup <input id='s1' type='number' value='"+st.minGroup+"'></label></p><p><label>retentionMonths <input id='s2' type='number' value='"+st.retentionMonths+"'></label></p><p><label>reviewClosedAt <input id='s3' value='"+esc(st.reviewClosedAt)+"' placeholder='YYYY-MM-DD'></label></p><p><button id='ss'>Save settings</button> <button class='alt' id='pg'>Run deletion now</button> <span id='sm'></span></p>";
  $("#ss").onclick=function(){setDoc(doc(DB,"settings","main"),{minGroup:Math.max(5,+$("#s1").value||20),retentionMonths:+$("#s2").value||12,reviewClosedAt:$("#s3").value}).then(function(){$("#sm").textContent="Saved."}).catch(function(e){$("#sm").textContent=e.message})};
  $("#pg").onclick=function(){if(!st.reviewClosedAt){$("#sm").textContent="Set reviewClosedAt first.";return}var due=new Date(st.reviewClosedAt);due.setMonth(due.getMonth()+st.retentionMonths);if(new Date()<due){$("#sm").textContent="Not due until "+due.toISOString().slice(0,10)+".";return}if(!confirm("Delete ALL people, emails and submissions?"))return;
    log("purge").then(function(){return Promise.all(["submissions","people","emails"].map(function(n){return getDocs(collection(DB,n)).then(function(s){var ids=[];s.forEach(function(d){ids.push(d.id)});var jobs=[];for(var i=0;i<ids.length;i+=400){var b=writeBatch(DB);ids.slice(i,i+400).forEach(function(id){b.delete(doc(DB,n,id))});jobs.push(b.commit())}return Promise.all(jobs)})}))}).then(function(){$("#sm").textContent="Deleted."}).catch(function(e){$("#sm").textContent=e.message})}})}
};
</script></body></html>
