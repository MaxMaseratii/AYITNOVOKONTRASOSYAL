function give(){
  return fb().then(function(x){return profile(x).then(function(p){
    return x.F.addDoc(x.F.collection(x.db,"downloads"),{uid:USER.uid,name:p.name,email:USER.email,country:p.country,part:want,lang:lang,at:x.F.serverTimestamp()}).then(function(){
      fileFor(want,p);
      dlg("<h2>"+esc(t("okT"))+"</h2><p>"+esc(t("okB"))+"</p><p class='note'>"+esc(t("as"))+" "+esc(USER.email)+". <button type='button' class='lnk' id='so'>"+esc(t("out"))+"</button></p><div class='row'><button class='btn' id='dx'>"+esc(t("close"))+"</button></div>");
      $("#dx").onclick=closeDlg;$("#so").onclick=function(){x.A.signOut(x.auth).then(function(){USER=null;PROFILE=null;closeDlg()})};
    })})});
}
function ask(part){
  want=part;
  if(!READY){soon();return}
  fb().then(function(){if(USER)give().catch(function(er){if(er&&er.message==="profile")form("reg");else{dlg("<h2>"+esc(t("eNet"))+"</h2><div class='row'><button class='btn' id='dx'>"+esc(t("close"))+"</button></div>");$("#dx").onclick=closeDlg}});else form("reg")}).catch(soon);
}
$("#dl1").onclick=function(){var s=DOC[lang]&&DOC[lang][cur];if(s)ask(s.id)};
$("#dlA").onclick=function(){ask(0)};
window.__reader={fileFor:fileFor,setLang:setLang};
setLang(lang);
})();
</script>
</body></html>
